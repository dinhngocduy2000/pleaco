x-mock-device-base: &mock-device-base
  build:
    context: .
  image: pleaco-mock-device
  environment: &mock-device-environment
    MQTT_HOST: host.docker.internal
    MQTT_PORT: 1883
    ROBOT_INITIAL_SEQUENCE: 1000
    ROBOT_STATE_PATH: /data/sequence.txt

services:
  mock-device-1:
    <<: *mock-device-base
    environment:
      <<: *mock-device-environment
      ROBOT_ID: d67e006a-c9bd-4dbf-852d-15224a5a283d
      ROBOT_SERIAL_NUM: PLC-001
      ROBOT_IP_ADDRESS: 192.168.10.24
    volumes:
      - ./data/robot-1:/data

  mock-device-2:
    <<: *mock-device-base
    environment:
      <<: *mock-device-environment
      ROBOT_ID: 4eb0c6ba-2954-48c7-806b-624ea043d9f0
      ROBOT_SERIAL_NUM: PLEA-001
      ROBOT_IP_ADDRESS: 192.168.0.0
    volumes:
      - ./data/robot-2:/data

  mock-device-3:
    <<: *mock-device-base
    environment:
      <<: *mock-device-environment
      ROBOT_ID: fc3ff39f-5168-453a-b48e-04fbd8616767
      ROBOT_SERIAL_NUM: PLEA-002
      ROBOT_IP_ADDRESS: 192.168.1.2
    volumes:
      - ./data/robot-3:/data

  mock-device-4:
    <<: *mock-device-base
    environment:
      <<: *mock-device-environment
      ROBOT_ID: fbba9569-b10a-40ba-bea1-6ad0c222ac20
      ROBOT_SERIAL_NUM: PL-001
      ROBOT_IP_ADDRESS: 1.2.2.2
    volumes:
      - ./data/robot-4:/data

  mock-device-5:
    <<: *mock-device-base
    environment:
      <<: *mock-device-environment
      ROBOT_ID: e122c8c6-b557-4bf4-b8ad-8fbf6461e071
      ROBOT_SERIAL_NUM: PL-0001
      ROBOT_IP_ADDRESS: 192.168.1.1
    volumes:
      - ./data/robot-5:/data
